<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekHub | Trek | Add</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg border-2 border-bottom border-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <b>
                <span class="text-primary">Trek</span><span class="text-danger">Hub</span>
            </b>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="/admin_dashboard/{{user.user_id}}/{{user.auth_key}}/">Dashboard</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="/admin_dashboard/{{user.user_id}}/{{user.auth_key}}/treks/">Treks</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="/admin_dashboard/{{user.user_id}}/{{user.auth_key}}/trekkers/">Trekkers</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="/admin_dashboard/{{user.user_id}}/{{user.auth_key}}/staff/">Staff</a>
            </li>
            </li>
        </ul>
        <form class="d-flex" role="logout" method="POST">
            <button class="btn btn-outline-danger" name ='logout' value="logout" type="submit">Logout</button>
        </form>
        </div>
    </div>
    </nav>

    <div class="alert alert-{{alert_type}} bg-white {{alert_visibility}} alert-dismissible fade show m-4" role="alert">
        <strong>{{alert_status}} !</strong>{{alert_message}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex mt-5 fs-3 justify-content-center font-monospace">
        <p class = "text-danger">Add new Trek</p>
    </div>

    <div class="d-flex justify-content-center">
        <div class="container mt-3 border border-1 border-primary rounded p-4" style="max-width: 500px;"> 
            <form class="row g-3 " method="POST">
                <div class="col-md-6">
                    <label for="    " class="form-label">Name</label>
                    <input name="name" type="name" class="form-control" id="inputName" required>
                </div>
                <div class="col-md-6">
                    <label for="inputSlots" class="form-label">Slots</label>
                    <input name="slots" type="number" class="form-control" id="inputSlots" required>
                </div>
                <div class="col-md-12">
                    <label for="inputLocation" class="form-label">Location</label>
                    <input name="location" type="location" class="form-control" id="inputLocation" required>
                </div>
                <div class="col-md-6">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select name="difficulty" id="difficulty" class="form-select" required>
                    <option value = 'easy'>Easy</option>
                    <option value = 'medium'>Medium</option>
                    <option value = 'hard'>Hard</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="staff_id" class="form-label">Assign Staff (ID)</label>
                    <select name="staff_id" id="staff_id" class="form-select" required>
                    {% for s in staff%}
                    <option value = '{{s.staff_id}}'>{{s.staff_id}}</option>
                    {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="inputLastdate" class="form-label">Booking End</label>
                    <input name="last_date" type="date" class="form-control " id="inputLactdate" required>
                </div>
                <div class="col-md-4">
                    <label for="inputTrekstart" class="form-label">Trek Start</label>
                    <input name="trek_start" type="date" class="form-control" id="inputTrekstart" required>
                </div>
                <div class="col-md-4">
                    <label for="inputTrekend" class="form-label">Trek End</label>
                    <input name="trek_end" type="date" class="form-control" id="inputTrekend" required>
                </div>
                <div class="col-md-12 pt-2">
                    <div class="d-flex justify-content-center ">
                        <button type="submit" name="add" value="add" class="btn btn-primary">Add Trek</button>
                    </div>
                </div>
                </form>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
