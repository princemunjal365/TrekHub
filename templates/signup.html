<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekHub | SignUp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg border-bottom border-primary border-2" >
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <b>
                <span class="text-primary">Trek</span><span class="text-danger">Hub</span>
            </b>
        </a>
    </div>
    </nav>

    <div class="alert alert-{{alert_type}} bg-white {{alert_visibility}} alert-dismissible fade show m-4" role="alert">
        <strong>{{alert_status}} !</strong>{{alert_message}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex mt-5 fs-3 justify-content-center font-monospace">
        <p class = "text-secondary">Getting Started with</p>
        <b><p class="text-primary">&nbsp;Trek</p></b><b><p class="text-danger">Hub</p></b>
    </div>

    <div class="d-flex justify-content-center">
        <div class="container-sm mt-3 border border-1 border-primary rounded-start rounded-end p-4" style="max-width: 500px;"> 
            <form class="row g-3 " method="POST">
                <div class="col-md-6">
                    <label for="inputName" class="form-label">Name</label>
                    <input name="name" type="name" class="form-control" id="inputName" required>
                </div>
                <div class="col-md-6">
                    <label for="inputEmail" class="form-label">Email</label>
                    <input name="email" type="email" class="form-control" id="inputEmail" required>
                </div>
                <div class="col-md-6">
                    <label for="inputPassword" class="form-label">Password</label>
                    <input name="password" type="password" class="form-control" id="inputPassword" required>
                </div>
                <div class="col-md-6">
                    <label for="role" class="form-label">Role</label>
                    <select name="role" id="role" class="form-select">
                    <option selected value = 'trekker'>Trekker</option>
                    <option value = 'staff'>Staff</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input name="address" type="text" class="form-control" id="inputAddress" required>
                </div>
                <div class="col-12">
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Register</button>
                        <span class="d-flex">
                            <p>Registered ? Go to</p>
                            <a href="/signin/" class="text-decoration-none">&nbsp;Signin</a>
                        </span>
                    </div>
                </div>
                </form>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
